spring:
  application:
    name: security-demo-oidc
  mvc:
    view:
      prefix: /WEB-INF/jsp/
      suffix: .jsp
  security:
    oauth2:
      client:
        registration:
          oidc:
            provider: oidc
            client-id: ${OIDC_CLIENT_ID:security-demo}
            client-secret: ${OIDC_CLIENT_SECRET:change-me}
            scope:
              - openid
              - profile
              - email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          oidc:
            issuer-uri: ${OIDC_ISSUER_URI:${OIDC_BASE_URL:http://localhost:9000/auth}/realms/${OIDC_REALM:security-demo}}
app:
  security:
    oauth2:
      login-uri: /oauth2/authorization/oidc
